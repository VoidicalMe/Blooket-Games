<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrong on Purpose</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div class="rail" aria-hidden="true"></div>

    <div class="stage">
      <header class="hud">
        <p class="hud-label">Lives</p>
        <div class="lives" role="img" aria-label="3 lives">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="currentColor" d="M24 42C24 42 6 30.5 6 18.5 6 11.8 11.2 7 17.4 7c3.4 0 6.1 1.7 6.6 4.2C24.5 8.7 27.2 7 30.6 7 36.8 7 42 11.8 42 18.5 42 30.5 24 42 24 42z"/>
          </svg>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="currentColor" d="M24 42C24 42 6 30.5 6 18.5 6 11.8 11.2 7 17.4 7c3.4 0 6.1 1.7 6.6 4.2C24.5 8.7 27.2 7 30.6 7 36.8 7 42 11.8 42 18.5 42 30.5 24 42 24 42z"/>
          </svg>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="currentColor" d="M24 42C24 42 6 30.5 6 18.5 6 11.8 11.2 7 17.4 7c3.4 0 6.1 1.7 6.6 4.2C24.5 8.7 27.2 7 30.6 7 36.8 7 42 11.8 42 18.5 42 30.5 24 42 24 42z"/>
          </svg>
        </div>
      </header>

      <main class="hero">
        <p class="eyebrow">A trick quiz</p>
        <h1>
          <span class="title-main">Wrong</span>
          <span class="title-sub">on purpose</span>
        </h1>
        <p class="rule">3 lives. A wrong answer stays. Don’t trust what you see.*</p>
      </main>

      <div class="action">
        <button type="button" class="start">Start</button>
        <p class="footnote">*except the Start button.</p>
      </div>
    </div>
  </div>
</body>
</html>
